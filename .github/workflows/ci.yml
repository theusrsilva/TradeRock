name: CI

# Roda só nas tags de versão (v*), que também publicam o Release. Nada roda em push nem em PR.
# workflow_dispatch: rodar à mão pela aba Actions (testa e gera os pacotes, sem publicar).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Mesma imagem do .devcontainer, para o CI e o dev usarem o mesmo ambiente.
      - name: Imagem de build
        run: docker build -t traderock-dev --build-arg USER_UID=$(id -u) --build-arg USER_GID=$(id -g) .devcontainer

      - name: Build e testes
        run: docker run --rm -v "$PWD:/workspace" -w /workspace traderock-dev scripts/ci.sh

  # .deb e AppImage (scripts/package-linux.sh). Na tag, também o código-fonte completo e o das
  # ferramentas de rede embutidas, que vão no Release.
  package:
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Versão
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "args=--sources" >> "$GITHUB_OUTPUT"
          else
            base=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)
            echo "version=$base-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      # Python embutido, Zig, fontes e binários do iw/ip e runtime do AppImage (todos com sha256 fixo).
      - name: Cache de downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/traderock
          key: traderock-${{ hashFiles('scripts/build-worker.sh', 'scripts/build-nettools.sh', 'scripts/package-linux.sh', 'worker/requirements.lock') }}

      - name: Imagem de build
        run: docker build -t traderock-dev --build-arg USER_UID=$(id -u) --build-arg USER_GID=$(id -g) .devcontainer

      - name: Pacotes
        run: |
          mkdir -p ~/.cache/traderock
          docker run --rm -v "$PWD:/workspace" -v "$HOME/.cache/traderock:/home/dev/.cache/traderock" -w /workspace \
            traderock-dev scripts/package-linux.sh "${{ steps.version.outputs.version }}" ${{ steps.version.outputs.args }}

      - name: Conferir o .deb (tudo do root, nada gravável por outros)
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb -I "$deb"
          if dpkg-deb -c "$deb" | awk '$2 != "root/root"' | grep .; then echo "arquivo que não é do root"; exit 1; fi
          if dpkg-deb -c "$deb" | awk '$1 !~ /^l/ && substr($1,6,1) == "w" || $1 !~ /^l/ && substr($1,9,1) == "w"' | grep .; then
            echo "arquivo gravável por grupo/outros"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: traderock-linux
          path: dist/
          if-no-files-found: error

  # Instala o .deb em sistemas limpos, roda o app como usuário comum e fala com o worker como root.
  smoke-deb:
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "debian:13"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: traderock-linux
          path: dist
      - name: Fumaça
        run: bash scripts/smoke-linux.sh deb dist/*.deb

  # AppImage (extrair e rodar, sem FUSE) + instalação do worker embutido com o script do app.
  smoke-appimage:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: traderock-linux
          path: dist
      - name: Bibliotecas da janela (o app confere na inicialização)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-0 libnotify4
      - name: Fumaça
        run: chmod +x dist/*.AppImage && sudo bash scripts/smoke-linux.sh appimage dist/*.AppImage

  # Windows (só ESP32): app, runtime do esptool e testes compilados aqui, no Linux (o mesmo núcleo do
  # easyworld com os patches); o job seguinte roda no Windows.
  package-windows:
    needs: build-test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Versão
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)
            echo "version=$base-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache de downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/traderock
          key: traderock-win-${{ hashFiles('scripts/package-windows.sh', 'worker/requirements.lock', 'worker/requirements-esp32-windows.lock') }}

      - name: Imagem de build
        run: docker build -t traderock-dev --build-arg USER_UID=$(id -u) --build-arg USER_GID=$(id -g) .devcontainer

      - name: App e testes para win-x64
        run: |
          mkdir -p ~/.cache/traderock
          docker run --rm -v "$PWD:/workspace" -v "$HOME/.cache/traderock:/home/dev/.cache/traderock" -w /workspace \
            traderock-dev scripts/package-windows.sh "${{ steps.version.outputs.version }}" --tests

      - uses: actions/upload-artifact@v4
        with:
          name: traderock-windows-build
          path: build/windows/
          if-no-files-found: error

  # No Windows: testes, instalador (Inno Setup) e fumaça (instala, confere, desinstala).
  windows:
    needs: package-windows
    runs-on: windows-2025
    steps:
      # Sem conversão de fim de linha: os testes comparam arquivos do repositório byte a byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: traderock-windows-build
          path: build/windows

      - name: Testes
        run: build\windows\tests\TradeRock.Tests.exe

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ needs.package-windows.outputs.version }}" `
            "/DSourceDir=$PWD\build\windows\app" "/DOutputDir=$PWD\dist" packaging\windows\traderock.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fumaça
        run: pwsh scripts/smoke-windows.ps1 "dist\TradeRock-Setup-${{ needs.package-windows.outputs.version }}.exe" "${{ needs.package-windows.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: traderock-windows
          path: dist/
          if-no-files-found: error

  # Tag v*: publica o Release (direto, sem rascunho) com os pacotes, o código-fonte e os checksums.
  release:
    if: github.ref_type == 'tag'
    needs: [package, smoke-deb, smoke-appimage, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: traderock-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: traderock-windows
          path: dist
      - name: Checksums com o instalador do Windows
        run: |
          cd dist && sha256sum -c SHA256SUMS
          sha256sum -- TradeRock-Setup-*.exe >> SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          prerelease=""
          [[ $version == *-* ]] && prerelease="--prerelease"
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "TradeRock $version" --generate-notes $prerelease
